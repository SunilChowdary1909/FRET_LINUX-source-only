[package]
name = "linux_fret_analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
libafl = { path = "../../WORK/FRET/LibAFL/libafl" }
libafl_qemu = { path = "../../WORK/FRET/LibAFL/libafl_qemu", default-features = false, features = ["systemmode", "aarch64"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
goblin = "0.8"
ctrlc = "3.4"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lib]
name = "linux_fret_analyzer"
path = "src/lib.rs"

[[bin]]
name = "fret_linux_analyzer"
path = "src/main.rs"
